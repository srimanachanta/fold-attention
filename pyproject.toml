[project]
name = "fold-attention"
version = "0.1.1"
description = "FoldAttention declares softmax’s reference before execution, making attention additive and enabling up to 3.09× faster H100 decode and deterministic backward faster than nondeterministic kernels."
readme = "README.md"
authors = [
    { name = "Sriman Achanta", email = "srimanachanta@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flash-attn-4==4.0.0b31",
    "numpy>=1.26",
    "nvidia-cutlass-dsl>=4.8.0",
    "quack-kernels>=0.6.5",
    "torch>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.optional-dependencies]
cu13 = [
    "flash-attn-4[cu13]==4.0.0b31",
    "nvidia-cutlass-dsl[cu13]>=4.8.0",
    "quack-kernels[cu13]>=0.6.5",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ty.environment]
python = ".venv"
extra-paths = [
    ".venv/lib/python3.14/site-packages/nvidia_cutlass_dsl/dsl_packages"
]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "cuda.bindings.**",
]
replace-imports-with-any = ["cutlass._mlir.**"]

# CuTe DSL kernels. The DSL's annotations cannot follow traced code: a
# `const_expr(x is not None)` branch does not narrow `x`, `cute.math`
# functions are generated at import, `Shape` and `.iterator` are wide unions
# (int, Integer, tuple, ...), `cute.struct` fields are subscripted classes, and
# flash-attn's `Int32` parameters take Python ints that the DSL promotes.
[[tool.ty.overrides]]
include = [
    "src/fold_attention/backward/kernel.py",
    "src/fold_attention/backward/postprocess.py",
    "src/fold_attention/backward/preprocess.py",
    "src/fold_attention/decode/combine.py",
    "src/fold_attention/decode/front.py",
    "src/fold_attention/decode/kernel.py",
    "src/fold_attention/decode/reference.py",
    "src/fold_attention/decode/write.py",
]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
no-matching-overload = "ignore"
not-subscriptable = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    # keyword dicts read as the calls they feed
    "C408",
    # Rewrites that break or change CuTe DSL tracing. A condition on a traced
    # value has no Python bool, so builtin `min`/`max` (PLR1730, FURB136) and
    # a ternary (SIM108) fail to compile; `enumerate` hides a `cutlass.range`
    # loop from the DSL's loop rewrite (SIM113); collapsing or merging `if`
    # statements (SIM102, SIM114) changes the regions a dynamic condition
    # traces into.
    "FURB136",
    "PLR1730",
    "SIM102",
    "SIM108",
    "SIM113",
    "SIM114",
]
